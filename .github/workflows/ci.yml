name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 两个 Node 版本各自报结论：一个失败不取消另一个（否则被取消的 job 看起来也像失败）
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      # 测试失败时把失败行提升为 check 注解 —— 注解可被 API 读取，日志不行
      - name: Test
        run: |
          set +e
          pnpm test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "^not ok|AssertionError|Error|✖" /tmp/test.log | head -8 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
      # 覆盖率报告（Node 内置，无额外依赖）
      - run: pnpm coverage
      # 夹具回归：每条规则「违规必报 × 合规不报」
      - run: pnpm self-test
      # 本体自包含：P1 依赖白名单 / P2 无宿主字面量 / P3 引擎无布局假设
      - run: pnpm self-check-portability
      # 拿示例工程当宿主跑一遍，证明可搬运且零误报
      - run: pnpm guard:sample
      # 狗粮：门禁跑自己（库范式角色表 + 配置豁免）
      - run: pnpm guard:self
